name: Deploy Pages

# Rebuilds the docs/demo site on every push to master and publishes it to
# GitHub Pages. Decoupled from npm releases (release.yml) — docs content can
# change without a version bump. Requires the repo's Settings > Pages source
# to be set to "GitHub Actions" (not "Deploy from a branch").
#
# Site layout: the archived Vue 2 docs (from the gh-pages branch) are served
# at /beaker/, and the Vue 3 docs built from master are served at /beaker/v1/.
#
# Uses `pnpm build` (vite.config.js, the docs-site config) — never
# `pnpm build:publish` (vite-publish.config.js, the library config). Both
# configs emit to ./dist by default, so they must never run in the same job.
on:
  push:
    branches: [master]

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site (Vue 3, served from /beaker/v1/)
        run: pnpm build
        env:
          BASE_PATH: /beaker/v1/

      # The Vue 2 docs site is a frozen build stored on the gh-pages branch.
      # It already uses the /beaker/ base path, so it deploys as-is at the
      # site root.
      - name: Check out the archived Vue 2 site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: vue2-site

      - name: Assemble site
        run: |
          rm -rf vue2-site/.git
          mkdir -p site/v1
          cp -R vue2-site/. site/
          cp -R dist/. site/v1/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
