name: Deploy Pages

# Rebuilds the docs/demo site on every push to master and publishes it to
# GitHub Pages. Decoupled from npm releases (release.yml) — docs content can
# change without a version bump. Requires the repo's Settings > Pages source
# to be set to "GitHub Actions" (not "Deploy from a branch").
#
# Site layout: the archived Vue 2 docs (from the gh-pages branch) are served
# at /beaker/, and the Vue 3 docs built from master are served at /beaker/v1/.
#
# Uses `pnpm build` (vite.config.js, the docs-site config) — never
# `pnpm build:publish` (vite-publish.config.js, the library config). Both
# configs emit to ./dist by default, so they must never run in the same job.
on:
  push:
    branches: [master]

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site (Vue 3, served from /beaker/v1/)
        run: pnpm build
        env:
          BASE_PATH: /beaker/v1/

      # The Vue 2 docs site is a frozen build stored on the gh-pages branch.
      # It already uses the /beaker/ base path, so it deploys as-is at the
      # site root.
      - name: Check out the archived Vue 2 site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: vue2-site

      - name: Assemble site
        run: |
          rm -rf vue2-site/.git
          mkdir -p site/v1
          cp -R vue2-site/. site/
          cp -R dist/. site/v1/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
